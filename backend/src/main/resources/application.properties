spring.application.name=game-tracker-api
server.port=${PORT:8080}

# Conexão com o PostgreSQL (usa variáveis de ambiente em produção ou valores locais por padrão)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/gametracker_db}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:celsius}

# Estratégia de DDL e Flyway
spring.jpa.hibernate.ddl-auto=validate

# Exibição de SQL no console (desativada em produção para economizar CPU/logs)
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Segurança e CORS
api.security.token.secret=${JWT_SECRET:celsius-dev-secret-key-trocar-em-producao}
api.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
